services:
  # Optional overlay: run a local Keycloak for OIDC login testing.
  #
  # Notes:
  # - For Docker Desktop, using `host.docker.internal` as the issuer allows both:
  #   - the browser (host) and
  #   - the Gateway (container)
  #   to verify the same `iss`.
  #
  # Usage:
  #   docker compose -f infra/docker-compose.full.yml -f infra/docker-compose.full.keycloak.yml up
  #
  # Suggested env (infra/.env):
  #   OA_AUTH_MODE=oidc
  #   OA_OIDC_ISSUER=http://host.docker.internal:8080/realms/openassistant
  #
  keycloak-db:
    image: ${KEYCLOAK_DB_IMAGE:-postgres:16}
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:latest}
    command: ["start", "--http-enabled=true", "--http-port=8080", "--hostname-strict=false", "--import-realm"]
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}

      - KC_DB=postgres
      - KC_DB_URL_HOST=keycloak-db
      - KC_DB_URL_DATABASE=keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - ./keycloak/realm-openassistant.json:/opt/keycloak/data/import/realm-openassistant.json:ro
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db

volumes:
  keycloak_db_data:

