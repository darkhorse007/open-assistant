<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; connect-src 'self' http: https: data: blob:; img-src 'self' data: blob:; media-src 'self' data: blob:; worker-src 'self' blob:; script-src 'self' 'unsafe-eval' http: https:; style-src 'self' 'unsafe-inline'"

    <style>

      body {
        margin: 0;
        height: 100%;

      model-viewer {
        width: 100%;

      }
      .empty {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        color: #cbd5e1;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        font-size: 14px;
      }
    </style>
    <title>Model Viewer</title>
  </head>
  <body>
    <div class="empty" id="empty">(no model)</div>
    <model-viewer id="viewer" camera-controls auto-rotate exposure="1.0" crossorigin="anonymous" style="display: none"></model-viewer>
    <script type="module" src="/src/model-frame.ts"></script>
