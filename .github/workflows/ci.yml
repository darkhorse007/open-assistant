name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright (Chromium)
        run: bunx --yes playwright install --with-deps chromium

      - name: Typecheck
        run: bun run typecheck

      - name: RC2/RC3 Negative Checks (OIDC + MCP + tags)
        env:
          OA_RC23_OUTPUT_FILE: test-results/rc2-rc3-negative-ci.log
        run: bun run test:rc2rc3

      - name: E2E (mock stack)
        run: bun run test:e2e

      - name: Upload CI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-assistant-ci-artifacts-${{ github.run_id }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
